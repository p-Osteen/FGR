<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitGirl Repacks</title>
    <meta name="description" content="A clean, modern browser for FitGirl Repacks. Search 7,800+ game repacks by title, year, and genre." />
    <meta name="referrer" content="no-referrer" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />

    <!-- Preload catalog data so it starts fetching in parallel with JS bundle -->
    <link rel="preload" href="/games.json" as="fetch" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://p-osteen.github.io/FGR/" />
    <meta property="og:title" content="FitGirl Repacks" />
    <meta property="og:description" content="A cleaner, faster way to browse FitGirl Repacks." />
    <meta property="og:image" content="https://p-osteen.github.io/FGR/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitGirl Repacks" />
    <meta name="twitter:description" content="A cleaner, faster way to browse FitGirl Repacks." />
    <meta name="twitter:image" content="https://p-osteen.github.io/FGR/og-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
